name: Daily FOI Scrape and MkDocs Update

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # - cron: '0 5 * * *' # 05:00 UTC
    - cron: '0 5 * * 1'   # weekly: Monday (1) at 05:00 UTC

permissions:
  contents: write  # Allow repo updates
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran default-jre

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Show current directory contents
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: |
          echo "Running scrape script"
          python foi-csc-scrape-tool.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Commit and push updated Markdown content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/*.md
          git commit -m "Update MkDocs content via workflow" || echo "No changes to commit"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
